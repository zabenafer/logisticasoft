<div
  class="login-page"
  [class.auth-validating]="validandoClerk"
  [ngStyle]="{
    '--portal-primary': portalActual.colorPrincipal,
    '--portal-soft': portalActual.colorSuave,
    '--portal-border': portalActual.colorBorde,
    '--portal-text': portalActual.colorTexto,
    '--portal-link': portalActual.colorLink
  }"
>
  <div class="login-shell">
    <a routerLink="/home" class="back-link">
      <mat-icon>arrow_back</mat-icon>
      <span>Volver al inicio</span>
    </a>

    <div class="login-card">
      <div class="login-top-accent"></div>

      <div class="portal-badge">
        <mat-icon>{{ portalActual.icono }}</mat-icon>
      </div>

      <h2>{{ portalActual.titulo }}</h2>
      <p class="subtitle">{{ portalActual.subtitulo }}</p>

      <form
        (ngSubmit)="onLogin()"
        class="login-form"
      >
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario o Email</mat-label>
          <input
            matInput
            [(ngModel)]="usuario"
            name="usuario"
            required
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            [disabled]="loadingLocal || loadingClerk || validandoClerk"
          />
          <mat-icon matPrefix>mail</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            [(ngModel)]="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            required
            autocomplete="current-password"
            [disabled]="loadingLocal || loadingClerk || validandoClerk"
          />
          <mat-icon matPrefix>lock</mat-icon>

          <button
            mat-icon-button
            matSuffix
            type="button"
            class="password-toggle"
            (click)="showPassword = !showPassword"
            [disabled]="loadingLocal || loadingClerk || validandoClerk"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="showPassword"
          >
            <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <div class="options">
          <mat-checkbox
            class="remember"
            [(ngModel)]="recordarme"
            name="recordarme"
            [disabled]="loadingLocal || loadingClerk || validandoClerk"
          >
            Recordarme
          </mat-checkbox>

          <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
        </div>

        <button
          mat-flat-button
          type="submit"
          class="login-button"
          [disabled]="loadingLocal || loadingClerk || validandoClerk"
        >
          {{ loadingLocal ? 'Ingresando...' : portalActual.botonTexto }}
        </button>

        <div class="divider">
          <span>o continuá con</span>
        </div>

        <button
          type="button"
          class="google-button"
          [class.loading]="loadingClerk"
          [disabled]="loadingLocal || loadingClerk || validandoClerk"
          (click)="onLoginClerk()"
        >
          <img
            src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
            alt="Google"
          />
          <span>{{ loadingClerk ? 'Conectando con Google...' : 'Continuar con Google' }}</span>
        </button>

        <p class="error-msg" *ngIf="errorMsg && !validandoClerk">
          {{ errorMsg }}
        </p>
      </form>
    </div>
  </div>

  <div class="auth-overlay" *ngIf="validandoClerk">
    <div class="auth-overlay-card">
      <mat-spinner diameter="42"></mat-spinner>

      <h3>Validando tu cuenta...</h3>
      <p>Estamos verificando tus permisos de acceso.</p>
    </div>
  </div>
</div>
