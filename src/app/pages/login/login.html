<div
  class="login-page"
  [ngStyle]="{
    '--portal-primary': portalActual.colorPrincipal,
    '--portal-soft': portalActual.colorSuave,
    '--portal-border': portalActual.colorBorde,
    '--portal-text': portalActual.colorTexto,
    '--portal-link': portalActual.colorLink
  }"
>
  <div class="login-shell">
    <a routerLink="/home" class="back-link">
      <mat-icon>arrow_back</mat-icon>
      <span>Volver al inicio</span>
    </a>

    <section class="portal-header">
      <div class="portal-badge">
        <mat-icon>{{ portalActual.icono }}</mat-icon>
      </div>

      <h2>{{ portalActual.titulo }}</h2>
      <p class="subtitle">{{ portalActual.subtitulo }}</p>

      <p class="error-msg" *ngIf="errorMsg">
        {{ errorMsg }}
      </p>
    </section>

    <section class="clerk-section">
      <mat-spinner *ngIf="loadingClerk" diameter="36"></mat-spinner>
      <div #clerkSignIn class="clerk-sign-in"></div>
    </section>
  </div>
</div>
